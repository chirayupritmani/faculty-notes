spring.application.name=faculty-notes

# Local development port. Jenkins uses 8080 and the external Tomcat uses 8081.
server.port=${PORT:8082}

# In-memory H2 database (data is reset on every restart)
spring.datasource.url=jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Health endpoint used by the pipeline and Ansible health checks
management.endpoints.web.exposure.include=health,info
