<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Notes Publishing System</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
  <h1>Faculty Notes Publishing System</h1>
  <nav>
    <a th:href="@{/}" id="nav-dashboard">Dashboard</a>
    <a th:href="@{/notes}" id="nav-notes">Notes</a>
    <a th:href="@{/notes/new}" id="nav-new">New note</a>
  </nav>
</header>
<main>
  <h2>Faculty Notes Overview</h2>
  <div class="cards">
    <div class="card"><span class="num" id="count-total" th:text="${totalCount}">0</span>Total notes</div>
    <div class="card"><span class="num" id="count-draft" th:text="${draftCount}">0</span>Draft</div>
    <div class="card"><span class="num" id="count-review" th:text="${reviewCount}">0</span>Under Review</div>
    <div class="card"><span class="num" id="count-published" th:text="${publishedCount}">0</span>Published</div>
  </div>

  <h3>Notes by subject</h3>
  <p id="no-subjects" th:if="${#lists.isEmpty(subjectCounts)}">No notes yet</p>
  <table id="subject-table" th:unless="${#lists.isEmpty(subjectCounts)}">
    <thead>
      <tr><th>Subject</th><th>Notes</th></tr>
    </thead>
    <tbody>
      <tr th:each="s : ${subjectCounts}">
        <td th:text="${s.subject}">Subject</td>
        <td th:text="${s.total}">0</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
