<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note - Faculty Notes Publishing System</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
  <h1>Faculty Notes Publishing System</h1>
  <nav>
    <a th:href="@{/}" id="nav-dashboard">Dashboard</a>
    <a th:href="@{/notes}" id="nav-notes">Notes</a>
    <a th:href="@{/notes/new}" id="nav-new">New note</a>
  </nav>
</header>
<main>
  <h2 id="note-title" th:text="${note.title}">Title</h2>
  <p>
    <strong>Subject:</strong> <span id="note-subject" th:text="${note.subject}">Subject</span><br>
    <strong>Author:</strong> <span id="note-author" th:text="${note.author}">Author</span><br>
    <strong>Status:</strong> <span id="note-status" th:text="${note.status.label}">Draft</span><br>
    <strong>Last updated:</strong>
    <span id="note-updated" th:text="${#temporals.format(note.updatedAt, 'dd MMM yyyy HH:mm')}">date</span>
  </p>

  <p class="error" id="flash-error" th:if="${error}" th:text="${error}">Error</p>
  <p id="review-comment" th:if="${note.reviewComment != null}">
    <strong>Reviewer comment:</strong> <span th:text="${note.reviewComment}">Comment</span>
  </p>

  <div id="note-content" style="white-space: pre-wrap;" th:text="${note.content}">Content</div>

  <p>
    <a class="btn" id="edit-button" th:if="${canEdit}" th:href="@{/notes/{id}/edit(id=${note.id})}">Edit</a>
    <a class="btn" id="back-link" th:href="@{/notes}">Back to notes</a>
  </p>

  <form method="post" th:if="${canEdit}" th:action="@{/notes/{id}/submit(id=${note.id})}">
    <button type="submit" id="submit-button">Submit for review</button>
  </form>

  <div th:if="${canReview}">
    <form method="post" th:action="@{/notes/{id}/approve(id=${note.id})}">
      <button type="submit" id="approve-button">Approve and publish</button>
    </form>
    <form method="post" th:action="@{/notes/{id}/return(id=${note.id})}">
      <label for="comment">Comment (required to return)</label>
      <textarea id="comment" name="comment" rows="3"></textarea>
      <button type="submit" id="return-button">Return to author</button>
    </form>
  </div>
</main>
</body>
</html>
